<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOVAPAY</title>
<meta name="theme-color" content="#0b6b4f"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://xtccabivvqdkfukuskgc.supabase.co; base-uri 'none'; form-action 'none'">

<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#0b1f2e;--mut:#667985;--g:#0b6b4f;--gold:#c9a24a;--ln:#e3eae6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08141d;--card:#102535;--tx:#eaf2ee;--mut:#8aa0ad;--ln:#1c3446;color-scheme:dark}}
:root[data-theme=dark]{--bg:#08141d;--card:#102535;--tx:#eaf2ee;--mut:#8aa0ad;--ln:#1c3446;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
#app{max-width:480px;margin:auto;min-height:100vh;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#0b6b4f,#0b2e3f);color:#fff;border:0}.bal{font-size:30px;font-weight:700;margin:6px 0}
button{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
.ghost{background:transparent;color:var(--g);border:1px solid var(--g)}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.mut{color:var(--mut);font-size:13px}.in{color:#12a36f}.out{color:#d94b4b}.err{color:#d94b4b;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);font-size:11px;padding:10px 0;border-radius:0}nav button.on{color:var(--g)}nav span{display:block;font-size:20px}
#m{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}#m>div{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px}
</style></head><body><div id="app"></div><div id="m"><div id="mc"></div></div>
<script>
const $=s=>document.querySelector(s),N=k=>'₦'+(k/100).toLocaleString('en-NG',{minimumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let C={url:'https://xtccabivvqdkfukuskgc.supabase.co',key:'',fpin:'hyper-api',ftr:'transfer',ffund:'fund-init'},SS=null,S={tab:'home',hide:0,bal:0,tx:[],acct:'',p:{},mode:'in',name:'',err:'',idem:crypto.randomUUID()};
try{Object.assign(C,JSON.parse(localStorage.getItem('npc')||'{}'));SS=JSON.parse(localStorage.getItem('nps')||'null')}catch(e){}
const setSS=j=>{SS=j?{access_token:j.access_token,refresh_token:j.refresh_token}:null;try{localStorage.setItem('nps',JSON.stringify(SS))}catch(e){}};
async function api(p,o={}){const h={apikey:C.key,'Content-Type':'application/json'};if(SS&&!o.noauth)h.Authorization='Bearer '+SS.access_token;
 try{const r=await fetch(C.url+p,{method:o.m||(o.b!==undefined?'POST':'GET'),headers:h,body:o.b!==undefined?JSON.stringify(o.b):undefined});let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&SS&&!o.noauth&&!o.retry&&await refresh())return api(p,{...o,retry:1});return{ok:r.ok,s:r.status,j}}
 catch(e){return{ok:false,s:0,j:{error:'Network error. Check your internet and the Project URL.'}}}}
async function refresh(){if(!SS)return false;const r=await api('/auth/v1/token?grant_type=refresh_token',{b:{refresh_token:SS.refresh_token},noauth:1});if(r.ok&&r.j.access_token){setSS(r.j);return true}setSS(null);return false}
const msg=r=>({pin_too_easy:'PIN is too easy. Avoid 1234, 1111 and similar.',wrong_pin:'Wrong current PIN.',pin_locked:'PIN locked for 15 minutes.'}[r.j?.error]||r.j?.error||r.j?.msg||r.j?.error_description||r.j?.message||'Something went wrong ('+r.s+')');
async function load(){const[a,b,c,d]=await Promise.all([api('/rest/v1/wallets?select=account_number'),api('/rest/v1/profiles?select=full_name,tier,kyc_status,referral_code,has_pin'),api('/rest/v1/rpc/my_balance_kobo',{b:{}}),api('/rest/v1/ledger_entries?select=amount_kobo,category,reference,created_at&order=created_at.desc&limit=20')]);
 S.err=b.ok?'':msg(b);S.acct=a.j?.[0]?.account_number||'';S.p=b.ok?(b.j?.[0]||{}):{};S.bal=c.ok?Number(c.j):0;S.tx=Array.isArray(d.j)?d.j:[]}
function m(h){$('#mc').innerHTML=h;$('#m').style.display='flex'}const x=()=>$('#m').style.display='none';$('#m').onclick=e=>{if(e.target.id=='m')x()};
const logo='<div style="text-align:center;padding:30px 0 10px"><h1 style="margin:0;color:var(--g)">NOVAPAY</h1><div class="mut">Banking Without Boundaries.</div></div>';
function cfgView(){return logo+`<div class="card"><b>Connect to your project</b><input id=c1 placeholder="Project URL (https://xxxx.supabase.co)" value="${esc(C.url)}"><input id=c2 placeholder="anon / publishable key" value="${esc(C.key)}"><input id=c3 value="${esc(C.fpin)}"><input id=c4 value="${esc(C.ftr)}"><input id=c5 placeholder="Funding function name" value="${esc(C.ffund)}"><button style="width:100%" onclick="saveC()">Save</button><div id=e class=err></div></div>`}
function saveC(){let u=$('#c1').value.trim().replace(/\/$/,''),k=$('#c2').value.trim();if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(u))return $('#e').textContent='URL must look like https://xxxx.supabase.co (not the dashboard link).';if(!k)return $('#e').textContent='Enter the key.';
 C={url:u,key:k,fpin:$('#c3').value.trim(),ftr:$('#c4').value.trim(),ffund:$('#c5').value.trim()||'fund-init'};try{localStorage.setItem('npc',JSON.stringify(C))}catch(e){}start()}
function authView(){const up=S.mode=='up';return logo+`<div class="card"><b>${up?'Create account':'Sign in'}</b>${up?'<input id=a0 placeholder="Full name">':''}<input id=a1 type=email placeholder="Email"><input id=a2 type=password placeholder="Password (8+ characters)"><button style="width:100%" onclick="doAuth()">${up?'Create account':'Sign in'}</button><div id=e class=err></div><p class=mut style="text-align:center"><a href="#" style="color:var(--g)" onclick="S.mode='${up?'in':'up'}';render();return false">${up?'I have an account':'Create a new account'}</a> • <a href="#" style="color:var(--g)" onclick="C.url='';render();return false">Change project</a></p></div><p class=mut style="text-align:center">Test project: sandbox funds only.</p>`}
async function doAuth(){const em=$('#a1').value.trim(),pw=$('#a2').value,up=S.mode=='up';if(!em||pw.length<8)return $('#e').textContent='Enter email and a password of 8+ characters.';
 const r=up?await api('/auth/v1/signup',{b:{email:em,password:pw,data:{full_name:($('#a0').value.trim()||'New user')}},noauth:1}):await api('/auth/v1/token?grant_type=password',{b:{email:em,password:pw},noauth:1});
 if(!r.ok)return $('#e').textContent=msg(r);if(!r.j.access_token){S.mode='in';render();return $('#e').textContent='Account created. Confirm your email, then sign in.'}
 setSS(r.j);await start()}
function pinView(){return logo+`<div class="card"><b>Create your transaction PIN</b><div class=mut>4 digits. You will use it for every transfer.</div><input id=p1 type=password inputmode=numeric maxlength=4 placeholder="New PIN"><input id=p2 type=password inputmode=numeric maxlength=4 placeholder="Confirm PIN"><button style="width:100%" onclick="mkPin()">Save PIN</button><div id=e class=err></div></div>`}
async function mkPin(){const a=$('#p1').value;if(!/^\d{4}$/.test(a))return $('#e').textContent='PIN must be 4 digits.';if(a!==$('#p2').value)return $('#e').textContent='PINs do not match.';
 const r=await api('/functions/v1/'+C.fpin,{b:{pin:a}});if(!r.ok)return $('#e').textContent=msg(r);await start()}
function mainView(){const t=S.tab,tx=e=>`<div class=row><div>${esc(e.category[0].toUpperCase()+e.category.slice(1))}<div class=mut>${new Date(e.created_at).toLocaleString()} • ${esc(e.reference)}</div></div><b class="${e.amount_kobo>0?'in':'out'}">${e.amount_kobo>0?'+':'−'}${N(Math.abs(e.amount_kobo))}</b></div>`;
 if(t=='home')return`<div class=row style="border:0"><div><div class=mut>Welcome back,</div><b style="font-size:18px">${esc((S.p.full_name||'').split(' ')[0])} 👋</b></div></div><div class="card hero"><small>Available balance • Tier ${esc(S.p.tier)}</small><div class=bal>${S.hide?'₦ ••••••':N(S.bal)}</div><div class=row style="border:0"><small>Account ${esc(S.acct)}</small><button class=ghost style="color:#fff;border-color:#fff8;padding:6px 12px" onclick="S.hide^=1;render()">${S.hide?'Show':'Hide'}</button></div></div><div class=row style="border:0;gap:8px"><button style="flex:1" onclick="S.tab='tr';render()">Send money</button><button style="flex:1" class=ghost onclick="fund()">Add money</button><button class=ghost onclick="refreshHome()">⟳</button></div><h3>Recent transactions</h3><div class=card>${S.tx.length?S.tx.map(tx).join(''):'<p class=mut>No transactions yet.</p>'}</div>`;
 if(t=='tr')return`<h2>Send to NOVAPAY user</h2><div class=card><input id=t1 inputmode=numeric maxlength=10 placeholder="Recipient account number" oninput="vn(this.value)"><div id=t2 class=mut></div><input id=t3 type=number placeholder="Amount (₦)"><div id=e class=err></div><button style="width:100%" onclick="go()">Continue</button><div class=mut style="margin-top:8px">Transfers to other banks need a licensed payment provider and are not enabled yet.</div></div>`;
 if(t=='cards')return`<h2>Cards</h2><div class=card>Virtual cards need an authorized card issuer. Not enabled in this test version.</div>`;
 if(t=='rw')return`<h2>Rewards</h2><div class="card hero"><small>Your referral code</small><div class=bal>${esc(S.p.referral_code)}</div></div><div class=card class=mut>Referral tracking and rewards will be added with the admin settings.</div>`;
 return`<h2>Profile</h2><div class=card><b>${esc(S.p.full_name)}</b><div class=mut>Account ${esc(S.acct)} • Tier ${esc(S.p.tier)} • KYC: ${esc(S.p.kyc_status)}</div></div><div class=card><div class=row><span>Theme</span><button class=ghost onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">Toggle</button></div><div class=row><span>Change PIN</span><button class=ghost onclick="chPin()">Change</button></div><div class=row style="border:0"><span>All devices</span><button class=ghost onclick="out(1)">Log out everywhere</button></div></div><button class=ghost style="width:100%" onclick="out(0)">Log out</button>`}
async function vn(v){const e=$('#t2');if(v.length<10)return e.textContent='';e.textContent='Checking…';const r=await api('/functions/v1/'+C.ftr,{b:{action:'resolve',account:v}});if($('#t1').value!==v)return;S.name=r.ok?r.j.name:'';e.textContent=r.ok?'✔ '+r.j.name:msg(r)}
function go(){const a=$('#t1').value,n=+$('#t3').value;if(!/^\d{10}$/.test(a)||!S.name)return $('#e').textContent='Enter a valid account number first.';if(!(n>0))return $('#e').textContent='Enter an amount.';
 m(`<b>Confirm transfer</b><div class=mut>To ${esc(S.name)} (${esc(a)})</div><h2>${N(Math.round(n*100))}</h2><input id=pp type=password inputmode=numeric maxlength=4 placeholder="Transaction PIN"><div id=pe class=err></div><button style="width:100%" id=pb>Send</button>`);
 $('#pb').onclick=async()=>{$('#pb').disabled=true;const r=await api('/functions/v1/'+C.ftr,{b:{action:'send',account:a,amount_naira:n,pin:$('#pp').value,idempotency_key:S.idem}});$('#pb').disabled=false;
  if(!r.ok)return $('#pe').textContent=msg(r);S.idem=crypto.randomUUID();S.name='';await load();m(`<div style="text-align:center"><div style="font-size:46px">✅</div><h3>Successful</h3><h2>${N(Math.round(n*100))}</h2><div class=mut>Ref: ${esc(r.j.reference)}</div><button style="width:100%;margin-top:12px" onclick="x();S.tab='home';render()">Done</button></div>`)}}
function fund(){m(`<b>Add money</b><div class=mut>Pay by card, bank transfer or USSD through Paystack (test mode: use Paystack test details).</div><input id=f1 type=number placeholder="Amount (₦)"><div id=fe class=err></div><button style="width:100%" id=fb>Continue to Paystack</button>`);
 $('#fb').onclick=async()=>{const a=+$('#f1').value;if(!(a>=100))return $('#fe').textContent='Minimum is ₦100.';$('#fb').disabled=true;const r=await api('/functions/v1/'+C.ffund,{b:{amount_naira:a}});$('#fb').disabled=false;if(!r.ok)return $('#fe').textContent=msg(r);window.open(r.j.authorization_url,'_blank');m(`<div style="text-align:center"><h3>Complete your payment</h3><div class=mut>After paying, come back here and tap Refresh.</div><button style="width:100%;margin-top:12px" onclick="refreshHome()">Refresh balance</button></div>`)}}
async function refreshHome(){await load();render()}
function chPin(){m(`<b>Change PIN</b><input id=q0 type=password inputmode=numeric maxlength=4 placeholder="Current PIN"><input id=q1 type=password inputmode=numeric maxlength=4 placeholder="New PIN"><div id=qe class=err></div><button style="width:100%" id=qb>Save</button>`);
 $('#qb').onclick=async()=>{if(!/^\d{4}$/.test($('#q1').value))return $('#qe').textContent='New PIN must be 4 digits.';const r=await api('/functions/v1/'+C.fpin,{b:{pin:$('#q1').value,current_pin:$('#q0').value}});if(!r.ok)return $('#qe').textContent=msg(r);x();alert('PIN changed')}}
async function out(all){await api('/auth/v1/logout?scope='+(all?'global':'local'),{b:{}});setSS(null);S.p={};render()}
function render(){x();const a=$('#app');if(!C.url||!C.key)return a.innerHTML=cfgView();if(!SS)return a.innerHTML=authView();
 if(S.err)return a.innerHTML=logo+`<div class="card err">${esc(S.err)}<p class=mut>If this mentions a column, run the security SQL step, then reload.</p><button onclick="start()">Retry</button> <button class=ghost onclick="out(0)">Log out</button></div>`;
 if(!S.p.has_pin)return a.innerHTML=pinView();
 const k=['home','tr','cards','rw','me'],l=['Home','Transfers','Cards','Rewards','Profile'],ic=['🏠','↔️','💳','🎁','👤'];
 a.innerHTML=mainView()+`<nav>${k.map((q,i)=>`<button class="${S.tab==q?'on':''}" onclick="S.tab='${q}';render()"><span>${ic[i]}</span>${l[i]}</button>`).join('')}</nav>`}
async function start(){if(SS)await load();render()}
(async()=>{if(SS&&C.url&&!(await refresh()))SS=null;start()})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
