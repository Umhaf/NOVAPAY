<style>

.day{font-size:12px;color:var(--mut);margin:10px 0 0;text-transform:uppercase;letter-spacing:.5px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -4px 20px #0b1f2e14;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;color:var(--mut);font-size:11px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button.on{color:var(--g);font-weight:700}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}#m>div{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:92%;overflow:auto;animation:up .25s}

.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 8px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--g)}.dots i.on{background:var(--g)}.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.k{font-size:22px;font-weight:600;padding:14px 0;border-radius:16px;background:var(--bg)}.k:active{background:var(--ln)}
.sk{background:linear-gradient(90deg,var(--ln),var(--bg),var(--ln));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px;height:44px;margin:8px 0}@keyframes sh{to{background-position:-200% 0}}

.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#e6c473);color:#0b1f2e;display:grid;place-items:center;font-size:22px;font-weight:800}
.tick{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 10px;animation:pop .4s}@keyframes pop{from{transform:scale(.3)}}

<script>
const $=s=>document.querySelector(s),N=k=>'₦'+(Math.abs(k)/100).toLocaleString('en-NG',{minimumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const TT={en:{home:'Home',tr:'Transfers',cards:'Cards',rw:'Rewards',me:'Profile',hi:'Welcome back',bal:'Total balance',add:'Add money',send:'Send money',recent:'Recent transactions'},
ha:{home:'Gida',tr:'Aika',cards:'Katuna',rw:'Lada',me:'Bayani',hi:'Barka da dawowa',bal:'Jimillar kuɗi',add:'Ƙara kuɗi',send:'Aika kuɗi',recent:'Ma’amaloli na baya'}};
const C={url:'https://xtccabivvqdkfukuskgc.supabase.co',key:'sb_publishable_PcxGniUY5YvxaAlCZL8O1g_6Yz0SAS8',fpin:'hyper-api',ftr:'transfer',ffund:'fund-init',fsav:'savings',fsup:'support'};
let SS=null,S={tab:'home',hide:0,bal:0,tx:[],acct:'',p:{},mode:'in',name:'',err:'',idem:crypto.randomUUID(),sig:'',st:'',lang:'en',rec:[],loaded:0,goals:[],tickets:[],notes:[],reg:0};
try{SS=JSON.parse(localStorage.getItem('nps')||'null');S.lang=localStorage.getItem('npl')||'en';S.rec=JSON.parse(localStorage.getItem('npr')||'[]')}catch(e){}
const t=k=>TT[S.lang][k],setSS=j=>{SS=j?{access_token:j.access_token,refresh_token:j.refresh_token}:null;try{localStorage.setItem('nps',JSON.stringify(SS))}catch(e){}};
async function api(p,o={}){const h={apikey:C.key,'Content-Type':'application/json'};if(SS&&!o.noauth)h.Authorization='Bearer '+SS.access_token;
 try{const r=await fetch(C.url+p,{method:o.m||(o.b!==undefined?'POST':'GET'),headers:h,body:o.b!==undefined?JSON.stringify(o.b):undefined});let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&SS&&!o.noauth&&!o.retry&&await refresh())return api(p,{...o,retry:1});return{ok:r.ok,s:r.status,j}}
 catch(e){return{ok:false,s:0,j:{error:'Network error. Check your internet.'}}}}
async function refresh(){if(!SS)return false;const r=await api('/auth/v1/token?grant_type=refresh_token',{b:{refresh_token:SS.refresh_token},noauth:1});if(r.ok&&r.j.access_token){setSS(r.j);return true}setSS(null);return false}
const msg=r=>({pin_too_easy:'PIN is too easy. Avoid 1234, 1111 and similar.',wrong_pin:'Wrong current PIN.',pin_locked:'PIN locked for 15 minutes.'}[r.j?.error]||r.j?.error||r.j?.msg||r.j?.error_description||r.j?.message||'Something went wrong ('+r.s+')');
async function load(){const[a,b,c,d,g,nn]=await Promise.all([api('/rest/v1/wallets?select=account_number'),api('/rest/v1/profiles?select=full_name,tier,kyc_status,referral_code,has_pin'),api('/rest/v1/rpc/my_balance_kobo',{b:{}}),api('/rest/v1/ledger_entries?select=amount_kobo,category,reference,created_at&order=created_at.desc&limit=40'),api('/rest/v1/savings_goals?select=id,name,target_kobo,saved_kobo,frequency,auto,auto_amount_kobo,next_run_at&order=created_at.desc'),api('/rest/v1/notifications?select=id,kind,title,body,read,created_at&order=created_at.desc&limit=30')]);
 S.err=b.ok?'':msg(b);S.acct=a.j?.[0]?.account_number||'';S.p=b.ok?(b.j?.[0]||{}):{};S.bal=c.ok?Number(c.j):S.bal;S.tx=Array.isArray(d.j)?d.j:S.tx;S.goals=Array.isArray(g.j)?g.j:S.goals;S.notes=Array.isArray(nn.j)?nn.j:S.notes;S.loaded=1}
function toast(x){const e=$('#toast');e.textContent=x;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}
async function cp(x){try{await navigator.clipboard.writeText(x);toast('Copied')}catch(e){toast('Copy failed')}}
async function sh(){if(navigator.share){try{await navigator.share({text:S.st})}catch(e){}}else cp(S.st)}
function m(h){$('#mc').innerHTML=h;$('#m').style.display='flex'}const x=()=>$('#m').style.display='none';$('#m').onclick=e=>{if(e.target.id=='m')x()};
function pad(title,sub,cb){let v='';m(`<div style="text-align:center"><b style="font-size:17px">${title}</b><div class=mut>${sub}</div><div class=dots id=dots><i></i><i></i><i></i><i></i></div><div id=pe class=err></div><div class=kp>${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button class=k data-k="${k}">${k}</button>`).join('')}</div></div>`);
 const dr=()=>[...$('#dots').children].forEach((d,i)=>d.className=i<v.length?'on':'');
 $('#mc').querySelectorAll('.k').forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(k!==''&&v.length<4)v+=k;dr();
  if(v.length===4){const d=$('#dots');const r=await cb(v);if(r&&$('#dots')){$('#pe').textContent=r;v='';dr();d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400)}}})}

function authView(){const up=S.mode=='up';return logo+`<div class=card><b style="font-size:17px">${up?'Create your account':'Sign in'}</b>${up?'<input id=a0 placeholder="Full name">':''}<input id=a1 type=email placeholder="Email address"><input id=a2 type=password placeholder="Password (8+ characters)"><button class=pri onclick="doAuth()">${up?'Create account':'Sign in'}</button><div id=e class=err style="margin-top:8px"></div><p class=mut style="text-align:center"><a href="#" style="color:var(--g);font-weight:600" onclick="S.mode='${up?'in':'up'}';render();return false">${up?'I already have an account':'Create a new account'}</a></p></div><p class=mut style="text-align:center">Test mode: sandbox funds only.</p>`}
async function doAuth(){const em=$('#a1').value.trim(),pw=$('#a2').value,up=S.mode=='up';if(!em||pw.length<8)return $('#e').textContent='Enter your email and a password of 8+ characters.';
 const r=up?await api('/auth/v1/signup',{b:{email:em,password:pw,data:{full_name:($('#a0').value.trim()||'New user')}},noauth:1}):await api('/auth/v1/token?grant_type=password',{b:{email:em,password:pw},noauth:1});
 if(!r.ok)return $('#e').textContent=msg(r);if(!r.j.access_token){S.mode='in';render();return $('#e').textContent='Account created. Confirm your email, then sign in.'}setSS(r.j);await start()}
function pinView(){return logo+`<div class=card style="text-align:center"><div class="tick" style="background:var(--g)">${I('lock')}</div><b style="font-size:17px">Create your transaction PIN</b><div class=mut>Four digits. You will need it for every transfer.</div><button class=pri onclick="mkPin()">Create PIN</button></div>`}
function mkPin(){pad('Create PIN','Choose 4 digits',a=>{pad('Confirm PIN','Enter it again',async b=>{if(a!==b)return 'PINs do not match';const r=await api('/functions/v1/'+C.fpin,{b:{pin:a}});if(!r.ok)return msg(r);x();toast('PIN created');await start()})})}
function chPin(){pad('Current PIN','Enter your current PIN',c=>{pad('New PIN','Choose a new 4-digit PIN',async n=>{const r=await api('/functions/v1/'+C.fpin,{b:{pin:n,current_pin:c}});if(!r.ok)return msg(r);x();toast('PIN changed')})})}
const dl=d=>{const a=new Date(d),k=z=>z.toDateString();return k(a)==k(new Date())?'Today':k(a)==k(new Date(Date.now()-864e5))?'Yesterday':a.toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'})};
const tl=e=>e.category=='deposit'?'Wallet funding':e.category=='transfer'?(e.amount_kobo>0?'Transfer received':'Transfer sent'):e.category[0].toUpperCase()+e.category.slice(1);
function txList(a){if(!a.length)return '<p class=mut style="text-align:center;padding:18px 0">No transactions yet.<br>Add money to get started.</p>';let last='',h='';a.forEach((e,i)=>{const d=dl(e.created_at);if(d!==last){h+=`<div class=day>${d}</div>`;last=d}const p=e.amount_kobo>0;
 h+=`<div class=row onclick="txs(${i})"><div class="bub ${p?'in':'out'}">${I(p?'down':'up')}</div><div class=g><div>${tl(e)}</div><div class=mut>${new Date(e.created_at).toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'})}</div></div><b class="${p?'in':'out'}">${p?'+':'−'}${N(e.amount_kobo)}</b></div>`});return h}
function txs(i){const e=S.tx[i],p=e.amount_kobo>0;S.st=`NOVAPAY receipt\n${tl(e)}\n${N(e.amount_kobo)}\nRef: ${e.reference}\n${new Date(e.created_at).toLocaleString()}`;

function fund(){m(`<b style="font-size:17px">${t('add')}</b><div class=mut>Pay by card, bank transfer or USSD through Paystack (test mode).</div><input id=f1 type=number inputmode=decimal placeholder="₦0.00" style="font-size:22px;font-weight:700"><div class=chips>${[1000,2000,5000,10000].map(a=>`<button class=chip onclick="setA('f1',${a})">₦${a.toLocaleString()}</button>`).join('')}</div><div id=fe class=err></div><button class=pri id=fb>Continue to Paystack</button>`);
 $('#fb').onclick=async()=>{const a=+$('#f1').value;if(!(a>=100))return $('#fe').textContent='Minimum is ₦100.';$('#fb').disabled=true;const r=await api('/functions/v1/'+C.ffund,{b:{amount_naira:a}});$('#fb').disabled=false;if(!r.ok)return $('#fe').textContent=msg(r);window.open(r.j.authorization_url,'_blank');m(`<div style="text-align:center"><b style="font-size:17px">Complete your payment</b><p class=mut>After paying, return here and refresh your balance.</p><button class=pri onclick="refreshHome()">Refresh balance</button></div>`)}}

 return`<div style="text-align:center;padding:6px 0 14px"><div class=av style="margin:0 auto 8px">${ini}</div><b style="font-size:18px">${esc(u.full_name)}</b><div class=mut>Account ${esc(S.acct)}</div></div>
